name: Build and verify Rifle Arena installers

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
    secrets:
      RIFLE_ANDROID_KEYSTORE:
        required: false
      RIFLE_ANDROID_ALIAS:
        required: false
      RIFLE_ANDROID_PASSWORD:
        required: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          godot_name="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fLsS --retry 3 "$base/$godot_name.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fLsS --retry 3 "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$godot_name" "$RUNNER_TEMP/godot"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$(dirname "$template_dir")"
          mv "$RUNNER_TEMP/godot-templates/templates" "$template_dir"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/android-licenses.log" || {
            test "${PIPESTATUS[1]}" -eq 0 || { cat "$RUNNER_TEMP/android-licenses.log"; exit 1; }
          }
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' \
            "$JAVA_HOME_21_X64" "$ANDROID_HOME" > "$HOME/.config/godot/editor_settings-4.6.tres"
      - name: Import and test
        run: |
          set -euo pipefail
          godot --headless --editor --import > "$RUNNER_TEMP/import.log" 2>&1 || { cat "$RUNNER_TEMP/import.log"; exit 1; }
          if grep -E 'ERROR:|Parse Error' "$RUNNER_TEMP/import.log"; then exit 1; fi
          python3 tools/release_version.py
          python3 tools/run_tests.py --suite all
      - name: Export and verify binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RIFLE_SIGNED: ${{ inputs.signed }}
          RIFLE_ANDROID_KEYSTORE: ${{ secrets.RIFLE_ANDROID_KEYSTORE }}
          RIFLE_ANDROID_ALIAS: ${{ secrets.RIFLE_ANDROID_ALIAS }}
          RIFLE_ANDROID_PASSWORD: ${{ secrets.RIFLE_ANDROID_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows" "$RUNNER_TEMP/dist"
          windows="$RUNNER_TEMP/windows"
          dist="$RUNNER_TEMP/dist"
          exe="$windows/RifleArena.exe"
          apk="$dist/RifleArena_Android_alpha.apk"
          signing_file="$RUNNER_TEMP/rifle-alpha.keystore"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected_package=com.riflearena.alpha
          trap 'rm -f -- "$signing_file"' EXIT
          godot --headless --export-release 'Windows x64' "$exe"
          if [[ "$RIFLE_SIGNED" == true ]]; then
            if [[ -z "$RIFLE_ANDROID_KEYSTORE" || -z "$RIFLE_ANDROID_ALIAS" || -z "$RIFLE_ANDROID_PASSWORD" ]]; then
              echo 'Configure the Android signing secrets before publishing.' >&2
              exit 1
            fi
            (umask 077; printf '%s' "$RIFLE_ANDROID_KEYSTORE" | base64 -d > "$signing_file")
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$signing_file"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RIFLE_ANDROID_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RIFLE_ANDROID_PASSWORD"
            godot --headless --export-release Android "$apk"
            previous_tag=$(python3 tools/release_version.py --field previous)
            if [[ -n "$previous_tag" ]]; then
              old="$RUNNER_TEMP/upgrade/previous.apk"
              mkdir -p "$(dirname "$old")"
              gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
                --pattern RifleArena_Android_alpha.apk --output "$old"
              fingerprint() {
                "$apksigner" verify --print-certs "$1" | awk -F ': ' '/certificate SHA-256 digest:/ {print $2}'
              }
              old_fingerprint=$(fingerprint "$old")
              [[ -n "$old_fingerprint" && "$old_fingerprint" == "$(fingerprint "$apk")" ]] || {
                echo 'Android signing certificate differs from the previous Alpha. In-place upgrade would fail.' >&2
                exit 1
              }
            fi
          else
            keytool -genkeypair -noprompt -keystore "$signing_file" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$signing_file"
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            preview_package="com.riflearena.preview.r$GITHUB_RUN_ID.a$GITHUB_RUN_ATTEMPT"
            expected_package="$preview_package"
            cp export_presets.cfg "$RUNNER_TEMP/export-presets.original"
            sed -i "s|^package/unique_name=\"com\.riflearena\.alpha\"$|package/unique_name=\"$preview_package\"|;
              s|^package/name=\"Rifle Arena Alpha\"$|package/name=\"Rifle Arena Preview\"|" export_presets.cfg
            godot --headless --export-debug Android "$apk"
            mv "$RUNNER_TEMP/export-presets.original" export_presets.cfg
          fi
          file "$exe" | grep -E 'PE32\+.*x86-64'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-metadata.txt"
          grep -F "package: name='$expected_package'" "$RUNNER_TEMP/apk-metadata.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'lib/arm64-v8a/libgodot_android.so' "$RUNNER_TEMP/apk-files.txt"
          grep -Fx 'assets/project.binary' "$RUNNER_TEMP/apk-files.txt"
          {
            label=$(python3 tools/release_version.py --field label)
            printf 'Rifle Arena %s - Windows x64\n\nExtraire le ZIP et ouvrir RifleArena.exe.\nGodot est inclus dans le jeu.\n\n' "$label"
            cat README.md
          } > "$windows/LISEZ_MOI.txt"
          source="https://raw.githubusercontent.com/godotengine/godot/$GODOT_VERSION"
          curl -fLsS --retry 3 "$source/LICENSE.txt" -o "$windows/LICENCE_GODOT.txt"
          curl -fLsS --retry 3 "$source/COPYRIGHT.txt" -o "$windows/NOTICES_GODOT.txt"
          cp CREDITS.md assets/fonts/LICENSE-*.txt "$windows/"
          (cd "$windows" && zip -q "$dist/RifleArena_Windows_x64.zip" ./*)
          unzip -tq "$dist/RifleArena_Windows_x64.zip"
          (cd "$dist" && sha256sum RifleArena_Windows_x64.zip RifleArena_Android_alpha.apk > SHA256SUMS)
          cat "$dist/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: rifle-alpha-installers
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: inputs.signed
        with:
          name: rifle-previous-android
          path: ${{ runner.temp }}/upgrade/previous.apk
          if-no-files-found: error

  android-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rifle-alpha-installers
      - uses: actions/download-artifact@v4
        if: inputs.signed
        with:
          name: rifle-previous-android
          path: prior
      - name: Install and launch the APK on Android
        env:
          RIFLE_SIGNED: ${{ inputs.signed }}
          RIFLE_ANDROID_API: ${{ matrix.api-level }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-$RIFLE_ANDROID_API;default;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/rifle-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          df -m "$RUNNER_TEMP"
          "$sdk_tools/sdkmanager" emulator "$image" 'build-tools;36.0.0'
          printf 'no\n' | "$sdk_tools/avdmanager" create avd --force --name rifle-ci --package "$image" \
            --path "$ANDROID_AVD_HOME/rifle-ci.avd"
          avd_config="$ANDROID_AVD_HOME/rifle-ci.avd/config.ini"
          sed -i '/^disk.dataPartition.size=/d' "$avd_config"
          printf 'disk.dataPartition.size=2048M\n' >> "$avd_config"
          sudo chown "$USER" /dev/kvm
          emulator="$ANDROID_HOME/emulator/emulator"
          adb="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_SERIAL=emulator-5554
          "$emulator" -avd rifle-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu lavapipe \
            -memory 2560 -cores 2 -partition-size 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          report_failure() {
            local status=$?
            if ((status != 0)); then
              tail -80 "$RUNNER_TEMP/emulator.log"
              timeout 12 "$adb" logcat -d -b crash || true
              timeout 12 "$adb" logcat -d -s ActivityManager AndroidRuntime godot libc | tail -100 || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap report_failure EXIT
          booted=false
          for attempt in {1..100}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            if [[ $("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ $booted != true ]]; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          sdk=$("$adb" shell getprop ro.build.version.sdk | tr -d '\r')
          [[ "$sdk" == "$RIFLE_ANDROID_API" ]]
          printf 'Android API %s\n' "$sdk"
          package=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging RifleArena_Android_alpha.apk |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          sha256sum --check SHA256SUMS
          if [[ "$RIFLE_SIGNED" == true ]]; then
            [[ "$package" == com.riflearena.alpha ]]
            test -s prior/previous.apk
            "$adb" install --no-incremental prior/previous.apk
            "$adb" install --no-incremental -r RifleArena_Android_alpha.apk
          else
            [[ "$package" =~ ^com\.riflearena\.preview\.r[0-9]+\.a[0-9]+$ ]]
            "$adb" install --no-incremental RifleArena_Android_alpha.apk
          fi
          "$adb" shell wm dismiss-keyguard
          activity=$("$adb" shell cmd package resolve-activity --brief "$package" | tail -n1 | tr -d '\r')
          [[ "$activity" == "$package/"* ]]
          "$adb" logcat -b all -c
          "$adb" shell am start -W -n "$activity" | tee "$RUNNER_TEMP/android-start.log"
          grep -F 'Status: ok' "$RUNNER_TEMP/android-start.log"
          sleep 9
          "$adb" shell dumpsys activity activities > "$RUNNER_TEMP/android-activity.log"
          "$adb" logcat -d -s AndroidRuntime godot > "$RUNNER_TEMP/android-runtime.log"
          tail -60 "$RUNNER_TEMP/android-runtime.log"
          "$adb" shell pidof "$package"
          grep -E '(topResumedActivity|mResumedActivity)' "$RUNNER_TEMP/android-activity.log" | grep -F "$package/"
          grep -F 'Godot Engine v' "$RUNNER_TEMP/android-runtime.log"
          if grep -E 'FATAL EXCEPTION|SCRIPT ERROR:|SHADER ERROR:|Program linking failed' "$RUNNER_TEMP/android-runtime.log"; then exit 1; fi

  windows-smoke:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rifle-alpha-installers
          path: distribution
      - name: Launch the EXE with a fresh and a previous profile
        shell: pwsh
        run: |
          foreach ($line in Get-Content distribution/SHA256SUMS) {
            $digest, $file = $line -split '\s+', 2
            if ((Get-FileHash "distribution/$file").Hash -ine $digest) { throw "Bad SHA-256 for $file" }
          }
          Expand-Archive distribution/RifleArena_Windows_x64.zip -DestinationPath installed
          $exe = (Resolve-Path installed/RifleArena.exe).Path
          foreach ($profile in @('fresh', 'alpha5')) {
            if ($profile -eq 'alpha5') {
              $save = Join-Path $env:APPDATA NeonRiftArena
              New-Item -Path $save -ItemType Directory -Force | Out-Null
              Copy-Item tests/fixtures/profile-v0.0.5.json (Join-Path $save pilot_profile.json)
            }
            $log = Join-Path $env:RUNNER_TEMP "rifle-$profile.log"
            $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -ArgumentList @('--headless', '--quit-after', '60', '--log-file', $log) -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Windows launch timed out for $profile" }
            if (-not (Test-Path $log)) { throw "Missing startup log for $profile" }
            Get-Content $log
            if ($process.ExitCode -ne 0 -or (Select-String -Path $log -Pattern 'ERROR:|Parse Error' -Quiet)) {
              throw "Windows launch failed for $profile"
            }
          }
      - name: Test desktop mouse input on Windows
        shell: pwsh
        run: |
          $engineName = "Godot_v${env:GODOT_VERSION}_win64"
          $engineDir = Join-Path $env:RUNNER_TEMP 'rifle-windows-engine'
          $archive = Join-Path $env:RUNNER_TEMP 'rifle-windows-engine.zip'
          $download = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/$engineName.exe.zip"
          curl.exe -fLsS --retry 3 $download -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the Windows Godot runner' }
          Expand-Archive $archive -DestinationPath $engineDir
          $godot = Join-Path $engineDir "${engineName}_console.exe"
          $env:NEON_QA_ISOLATED = '1'
          $env:NEON_QA_PROFILE_PATH = Join-Path $env:RUNNER_TEMP 'rifle-windows-mouse-profile'
          New-Item -ItemType Directory -Force -Path $env:NEON_QA_PROFILE_PATH | Out-Null
          Copy-Item tests/fixtures/profile-v0.0.5.json (Join-Path $env:NEON_QA_PROFILE_PATH pilot_profile.json)
          $importLog = Join-Path $env:RUNNER_TEMP 'rifle-windows-import.log'
          & $godot --headless --editor --import --log-file $importLog
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path $importLog -Pattern 'ERROR:|Parse Error' -Quiet)) {
            throw 'Godot import failed on Windows'
          }
          $log = Join-Path $env:RUNNER_TEMP 'rifle-windows-mouse.log'
          & $godot --headless --fixed-fps 60 --script res://tests/export_smoke.gd --log-file $log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path $log -Pattern '^FAIL |ERROR:|Parse Error' -Quiet)) {
            throw 'Desktop input regression on Windows'
          }
          if (-not (Select-String -Path $log -SimpleMatch 'PASS Le clic gauche' -Quiet)) {
            throw 'Missing left-click test result'
          }

name: Rifle Arena Alpha release

on:
  push:
    tags: ['v*-alpha']

concurrency:
  group: rifle-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release tag and review state
        env:
          GH_TOKEN: ${{ github.token }}
          RIFLE_HARDWARE_QA_TAG: ${{ vars.RIFLE_HARDWARE_QA_TAG }}
        run: |
          set -euo pipefail
          python3 tools/release_version.py --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$RIFLE_HARDWARE_QA_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo 'Hardware QA must be recorded for this exact tag before publishing.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag.' >&2
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build-alpha.yml
    with:
      signed: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rifle-alpha-installers
          path: distribution
      - name: Publish the verified installers and checksums together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 tools/release_version.py --tag "$GITHUB_REF_NAME")
          title=$(python3 tools/release_version.py --field label)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag.' >&2
            exit 1
          fi
          (cd distribution && sha256sum --check SHA256SUMS)
          awk -v heading="## $tag" '
            $0 == heading { section=1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ### Installation
          - Windows 64 bits — extraire le ZIP puis ouvrir RifleArena.exe. Godot est inclus.
          - Android — ouvrir l’APK sur le téléphone. L’émulateur vérifie le lancement et la mise à jour depuis l’Alpha précédente.
          - SHA256SUMS contient les empreintes des deux téléchargements. Voir le suivi QA du dépôt pour le détail des essais matériels.
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Rifle Arena $title" --notes-file "$RUNNER_TEMP/notes.md" \
            distribution/RifleArena_Android_alpha.apk distribution/RifleArena_Windows_x64.zip distribution/SHA256SUMS
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft | jq -e '
            .isDraft and ([.assets[] | select(.size > 0) | .name] | sort) ==
            ["RifleArena_Android_alpha.apk", "RifleArena_Windows_x64.zip", "SHA256SUMS"]'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
